# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - CTSNOTES

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      # Separate steps so a failure identifies itself: an install error and a
      # next build error land in two different red steps.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build (next build; prebuild no-ops on committed bundles)
        run: npm run build

      - name: Trim artifact
        run: |
          rm -f pawan_notes.pdf
          rm -rf AWS_notes azure sap
          rm -rf .next/cache node_modules/.cache .cache .git

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_9A4FD8ABA6EA49128BE9CA8243C31F43 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C527A92963074A76BACE80EBAC496B57 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_79204694B62F42C292B3CF529FC73D95 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'CTSNOTES'
          slot-name: 'Production'
          package: .
          